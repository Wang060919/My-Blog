title = "Wang"
baseurl = "/"
disableAliases = true
disableHugoGeneratorInject = true
# disableKinds = ["taxonomy", "term"]
enableEmoji = true
enableGitInfo = false
enableRobotsTXT = true
rssLimit = 10
summarylength = 20 # 70 (default)

# Multilingual
defaultContentLanguage = "zh"
hasCJKLanguage = true
disableLanguages = []
defaultContentLanguageInSubdir = false

copyRight = "Copyright (c) 2024-2026 Wang"

[build.buildStats]
  enable = true

[outputs]
  home = ["html", "rss", "searchIndex", "llms"]
  page = ["html", "markdown"]
  section = ["html", "rss"]
  taxonomy = ["html", "rss"]
  term = ["html", "rss"]

[outputFormats.searchIndex]
  mediaType = "application/json"
  baseName = "search-index"
  isPlainText = true
  notAlternative = true

[outputFormats.markdown]
  baseName = "index"
  isHTML = false
  isPlainText = true
  mediaType = "text/markdown"

[outputFormats.llms]
  baseName = "llms"
  isHTML = false
  isPlainText = true
  mediaType = "text/plain"

# Use Hugo's built-in site-wide sitemap, not a home/section output format.
[sitemap]
  changefreq = "monthly"
  filename = "sitemap.xml"
  priority = 0.5

[caches]
  [caches.getresource]
    dir = ":cacheDir/:project"
    maxAge = -1 # "30m"

[taxonomies]
  contributor = "contributors"
  category = "categories"
  tag = "tags"

[permalinks]
  blog = "/blog/:slug/"
  docs = "/docs/:sections[1:]/:slug/"
# docs = "/docs/1.0/:sections[1:]/:slug/"

[minify.tdewolff.html]
  keepComments = true # If set to false, build signatures are removed
  keepWhitespace = false

[pagination]
  pagerSize = 10

[related]
  threshold = 80
  includeNewer = true
  toLower = false
    [[related.indices]]
      name = "categories"
      weight = 100
    [[related.indices]]
      name = "tags"
      weight = 80
    [[related.indices]]
      name = "date"
      weight = 10

[imaging]
  anchor = "Center"
  bgColor = "#ffffff"
  resampleFilter = "Lanczos"
  # Hugo v0.163.0 起 quality/hint 需按格式配置
  [imaging.jpeg]
    quality = 85
  [imaging.webp]
    quality = 85
    hint = "photo"
  [imaging.avif]
    quality = 85
    hint = "photo"

# Ignore deprecation warnings
ignoreLogs = ['warning-goldmark-raw-html']
# Use Dart Sass (已安装)
[build]
  [build.transpiler]
    [build.transpiler.dartsass]
      enable = true


[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true  # Allow raw HTML in markdown
