name: Check site

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
      - name: Pin npm
        run: npm install --global npm@11.9.0
      - name: Install verified Hugo Extended
        run: npm run setup:cloud
      - name: Install locked dependencies
        run: npm ci --include=dev --cache .cache/npm
      - name: Test, build and verify
        run: npm run ci
