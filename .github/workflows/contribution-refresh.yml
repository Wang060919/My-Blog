name: Refresh public contribution calendar daily
on:
  schedule:
    # UTC 16:00 = next-day Asia/Shanghai 00:00. GitHub may delay scheduled runs.
    - cron: '0 16 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-contribution-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'Wang060919/My-Blog' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - name: Fetch and validate public daily aggregates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/update-contributions.js
          node scripts/check-contributions.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-contribution-snapshot
          path: data/github_contributions.json
          retention-days: 3
          if-no-files-found: error
  publish:
    needs: refresh
    if: github.repository == 'Wang060919/My-Blog' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-contribution-snapshot
          path: .cache/contribution-snapshot
      - name: Publish only the validated data JSON to main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-contributions.js
