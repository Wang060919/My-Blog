<article class="post-row" data-category="{{ with .Params.categories }}{{ index . 0 }}{{ end }}" data-home-reveal="card"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006.01.02" }}</time><div><h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3><p>{{ .Description | default (.Summary | plainify) | truncate 105 }}</p></div><span class="post-category">{{ with .Params.categories }}{{ index . 0 }}{{ else }}随记{{ end }}</span><span class="row-arrow" aria-hidden="true">↗</span></article>
