<header class="site-header">
 <div class="site-header-inner shell">
  <a class="wordmark" href="{{ "/" | relURL }}" aria-label="Wang，首页">Wang<span>.</span></a>
  <nav class="desktop-nav" aria-label="主导航">{{ range site.Menus.main }}<a href="{{ .URL | relURL }}"{{ if or (eq $.Section .Identifier) (and (eq .Identifier "blog") (or (in (slice "taxonomy" "term") $.Kind) (eq $.Layout "archives"))) }} aria-current="page"{{ end }}>{{ .Name }}</a>{{ end }}</nav>
  <div class="header-tools">
   <a class="icon-button" href="{{ "search/" | relURL }}" data-open-search aria-label="搜索全站"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></a>
   <a class="github-link icon-button" href="https://github.com/Wang060919" aria-label="Wang 的 GitHub">{{ partial "site/github.svg" . }}</a>
   <details class="mobile-nav"><summary aria-label="打开导航菜单"><span></span><span></span></summary><nav aria-label="手机主导航">{{ range site.Menus.main }}<a href="{{ .URL | relURL }}"{{ if or (eq $.Section .Identifier) (and (eq .Identifier "blog") (or (in (slice "taxonomy" "term") $.Kind) (eq $.Layout "archives"))) }} aria-current="page"{{ end }}>{{ .Name }} <span aria-hidden="true">↗</span></a>{{ end }}<a href="{{ "docs/" | relURL }}">文档 <span aria-hidden="true">↗</span></a><a href="{{ "archives/" | relURL }}">归档 <span aria-hidden="true">↗</span></a><a href="https://github.com/Wang060919">GitHub <span aria-hidden="true">↗</span></a></nav></details>
  </div>
 </div>
</header>
