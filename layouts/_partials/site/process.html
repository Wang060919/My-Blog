{{ $key := . }}

 {{ else if eq $key "esp32-lab" }}<span><i>01</i> 阅读资料</span><b aria-hidden="true">→</b><span><i>02</i> 理解连接</span><b aria-hidden="true">→</b><span><i>03</i> 整理问题</span>
 {{ else }}<span><i>01</i> 接收输入</span><b aria-hidden="true">→</b><span><i>02</i> 发起请求</span><b aria-hidden="true">→</b><span><i>03</i> 输出响应</span>{{ end }}
</div>
