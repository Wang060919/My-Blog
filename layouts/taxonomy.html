{{ define "main" }}<div class="shell page-space taxonomy-page"><header class="page-heading"><p class="eyebrow">EXPLORE BY TOPIC</p><h1>{{ if eq .Data.Plural "tags" }}标签{{ else if eq .Data.Plural "categories" }}分类{{ else }}主题{{ end }}</h1><p>从一个关键词，找到相连的记录。</p></header><div class="taxonomy-grid">{{ range .Data.Terms.ByCount }}<a href="{{ .Page.RelPermalink }}"><h2>{{ .Page.Title }}</h2><span>{{ .Count }} 篇文章 <span aria-hidden="true">↗</span></span></a>{{ end }}</div></div>{{ end }}
